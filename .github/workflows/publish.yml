name: publish

on:
  release:
    types: [ published ]

jobs:
  publish:
    # macOS so the Kotlin/Native iOS klibs are built and published alongside the JVM/Android ones.
    runs-on: macos-latest
    # Attaching the XCFramework to this release needs write access to its own repo's contents.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Publish to Maven Central
        # signAllPublications is opt-in — having the signing key set does not enable it, and Central
        # rejects unsigned deployments. Set here rather than in gradle.properties so
        # publishToMavenLocal still runs unsigned for local checks.
        #
        # publishAndRelease (rather than plain publish) also turns on the deployment validation wait,
        # so a deployment Central rejects fails this job instead of leaving it green.
        run: ./gradlew publishAndReleaseToMavenCentral -PsignAllPublications=true --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}

      - name: Assemble the iOS XCFramework
        run: ./gradlew :verivent-native:assembleVeriventKitReleaseXCFramework --no-configuration-cache

      - name: Zip and checksum it
        id: xcframework
        # ditto rather than zip: it is the only archiver Apple guarantees round-trips a framework's
        # symlinks and metadata, and a mangled archive only fails at the consumer's `swift build`.
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            verivent-native/build/XCFrameworks/release/VeriventKit.xcframework VeriventKit.xcframework.zip
          echo "checksum=$(swift package compute-checksum VeriventKit.xcframework.zip)" >> "$GITHUB_OUTPUT"

      - name: Attach it to this release
        # Must land before the verivent-swift tag exists: that tag's manifest points at this URL, and
        # SwiftPM resolves the manifest from the tag.
        run: gh release upload "$TAG" VeriventKit.xcframework.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}

      - name: Publish the Swift package
        # asanre/verivent-swift is generated wholesale from swift/ on every release — never edited by
        # hand. Apple has no package registry, so a git repo is the distribution channel.
        env:
          GH_TOKEN: ${{ secrets.VERIVENT_SWIFT_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          CHECKSUM: ${{ steps.xcframework.outputs.checksum }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/VeriventKit.xcframework.zip"

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/asanre/verivent-swift.git" spm
          rm -rf spm/Sources
          cp -R swift/Sources spm/Sources
          cp LICENSE spm/LICENSE
          sed -e "s|@VERIVENT_XCFRAMEWORK_URL@|${URL}|" \
              -e "s|@VERIVENT_XCFRAMEWORK_CHECKSUM@|${CHECKSUM}|" \
              swift/Package.swift.template > spm/Package.swift

          cd spm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release ${VERSION}"
          # Plain tag, never --force: a re-run rebuilds a byte-different zip, so a moved tag would
          # hand a stale checksum to anyone who already resolved. Re-running a published release is
          # unsupported once this tag exists — see docs/releasing.md for the manual recovery.
          git tag "$VERSION"
          # HEAD:main, not HEAD: on a freshly created (empty) repo the local branch name comes from
          # the runner's init.defaultBranch, which is not guaranteed to match.
          git push origin HEAD:main "$VERSION"

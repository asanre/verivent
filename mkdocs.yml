site_name: Verivent
site_description: On-device network + analytics inspector for Compose Multiplatform and native iOS
site_url: https://asanre.github.io/verivent/
site_author: Antoni Sanchez

repo_url: https://github.com/asanre/verivent
repo_name: asanre/verivent

docs_dir: docs
site_dir: build/mkdocs

# Maintainer-only notes are not part of the site.
exclude_docs: |
  releasing.md
  decisions/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - Integration: integration.md
  - Native iOS: native-ios.md
  - Guides:
      - Filters, redaction & annotations: filters-redaction-annotations.md
      - Analytics facade: integration-analytics-facade.md
      - Web viewer: web-viewer.md
      - Validator in the browser: validator-npm.md
  - Contributing: contributing.md
  - API reference: https://asanre.github.io/verivent/api/

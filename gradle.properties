org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g

# Dokka Gradle Plugin v2 (provides dokkaGenerate + the aggregating `dokka` configuration).
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 ships built-in Kotlin support that conflicts with the KMP plugin; opt back into the
# classic com.android.library/application + kotlin.multiplatform combo used across CMP.
android.builtInKotlin=false
android.newDsl=false

# --- Maven Central publishing (com.vanniktech.maven.publish) ---
# Shared coordinates and POM metadata; each publishable module adds only POM_NAME/POM_DESCRIPTION.
GROUP=io.github.asanre
VERSION_NAME=0.10.1

SONATYPE_HOST=CENTRAL_PORTAL
# Signing is driven by key presence: unsigned for local publishToMavenLocal, signed in CI where
# ORG_GRADLE_PROJECT_signingInMemoryKey is set (Central Portal requires signatures on release).

POM_URL=https://github.com/asanre/verivent/
POM_SCM_URL=https://github.com/asanre/verivent/
POM_SCM_CONNECTION=scm:git:git://github.com/asanre/verivent.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/asanre/verivent.git

POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_DEVELOPER_ID=asanre
POM_DEVELOPER_NAME=Antoni Sanchez
POM_DEVELOPER_URL=https://github.com/asanre/

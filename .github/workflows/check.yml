name: check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    # macOS so the Kotlin/Native iOS targets compile.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew check

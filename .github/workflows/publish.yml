name: publish

on:
  release:
    types: [ published ]

jobs:
  publish:
    # macOS so the Kotlin/Native iOS klibs are built and published alongside the JVM/Android ones.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Publish to Maven Central
        # signAllPublications is opt-in — having the signing key set does not enable it, and Central
        # rejects unsigned deployments. Set here rather than in gradle.properties so
        # publishToMavenLocal still runs unsigned for local checks.
        #
        # publishAndRelease (rather than plain publish) also turns on the deployment validation wait,
        # so a deployment Central rejects fails this job instead of leaving it green.
        run: ./gradlew publishAndReleaseToMavenCentral -PsignAllPublications=true --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
